<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P1 · 封面｜让云桌面里的 AI Agent 真正「懂你」</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  section { position:relative; width:1920px; height:1080px; overflow:hidden; }
  .blob { position:absolute; width:580px; height:580px; background:#E9EEF5; border-radius:44% 56% 58% 42% / 52% 44% 56% 48%; top:-200px; left:-180px; }
  .ring { position:absolute; width:250px; height:250px; border:34px solid #F4E5D2; border-radius:50%; top:-84px; right:128px; }
  .blob2 { position:absolute; width:420px; height:420px; background:#F1EBDE; border-radius:56% 44% 42% 58% / 48% 56% 44% 52%; bottom:-190px; right:-140px; }

  .cover { position:absolute; left:50%; top:50%; transform:translate(-50%,-52%); width:1280px; background:#FFFFFF; border-radius:32px;
           box-shadow:0 30px 80px rgba(31,58,92,.10); padding:82px 100px 62px; text-align:center; }
  .chip { display:inline-block; font-size:18px; letter-spacing:.06em; color:#55677D; background:#FBF9F4; border:1px solid #E4DDCE; border-radius:999px; padding:11px 30px; }
  h1 { font-family:'Noto Serif CJK SC', serif; font-weight:900; font-size:74px; line-height:1.32; color:#1F3A5C; margin-top:36px; }
  h1 .acc { color:#C25E0A; }
  .tripledot { display:flex; gap:12px; justify-content:center; margin:32px 0 24px; }
  .tripledot i { width:8px; height:8px; border-radius:50%; }
  .tripledot i:nth-child(1){ background:#C25E0A; } .tripledot i:nth-child(2){ background:#1F3A5C; } .tripledot i:nth-child(3){ background:#D9CDB8; }
  .slogan { font-size:24px; color:#3E5470; letter-spacing:.04em; }
  .slogan b { color:#C25E0A; font-weight:700; margin:0 16px; }
  .motif { margin:44px auto 0; width:780px; height:64px; display:flex; align-items:center; justify-content:center; gap:28px; }
  .dots { position:relative; width:212px; height:64px; flex:none; }
  .dots i { position:absolute; border-radius:50%; }
  .bars { display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
  .bar { display:flex; align-items:center; gap:8px; height:22px; padding:0 12px; background:#E9EEF5; border:1px solid #D8E1EC; border-radius:8px; }
  .bar i { width:6px; height:6px; border-radius:50%; background:#C25E0A; flex:none; }
  .b1 { width:138px; } .b2 { width:106px; } .b3 { width:154px; }
  .note { position:absolute; bottom:56px; left:0; right:0; text-align:center; font-size:20px; color:#6E6557; letter-spacing:.06em; }
</style>
</head>
<body>
<section id="p1">
  <div class="blob"></div>
  <div class="ring"></div>
  <div class="blob2"></div>
  <div class="cover">
    <span class="chip">基于 VDI 桌面记忆的 Agent 增强方案</span>
    <h1>让云桌面里的 AI Agent<br>真正<span class="acc">「懂你」</span></h1>
    <div class="tripledot"><i></i><i></i><i></i></div>
    <div class="slogan">不再「抽卡」<b>·</b>模糊指令可达成<b>·</b>数据属于企业</div>
    <div class="motif">
      <div class="dots">
        <i style="left:4px;  top:34px; width:10px; height:10px; background:#C25E0A;"></i>
        <i style="left:28px; top:12px; width:8px;  height:8px;  background:#1F3A5C; opacity:.55;"></i>
        <i style="left:46px; top:44px; width:12px; height:12px; background:#E4DED0;"></i>
        <i style="left:70px; top:22px; width:9px;  height:9px;  background:#1F3A5C; opacity:.35;"></i>
        <i style="left:92px; top:48px; width:8px;  height:8px;  background:#C25E0A; opacity:.6;"></i>
        <i style="left:112px;top:14px; width:11px; height:11px; background:#E9EEF5; border:1px solid #D8E1EC;"></i>
        <i style="left:134px;top:36px; width:9px;  height:9px;  background:#1F3A5C; opacity:.5;"></i>
        <i style="left:156px;top:20px; width:8px;  height:8px;  background:#C25E0A; opacity:.45;"></i>
        <i style="left:178px;top:44px; width:10px; height:10px; background:#1F3A5C; opacity:.3;"></i>
      </div>
      <svg width="44" height="20" viewBox="0 0 44 20" fill="none"><path d="M0 10 H38 M31 3 L40 10 L31 17" stroke="#C25E0A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="bars">
        <span class="bar b1"><i></i></span>
        <span class="bar b2"><i></i></span>
        <span class="bar b3"><i></i></span>
      </div>
    </div>
  </div>
  <div class="note">面向企业级云桌面环境&nbsp;&nbsp;|&nbsp;&nbsp;2026</div>
</section>
</body>
</html>
