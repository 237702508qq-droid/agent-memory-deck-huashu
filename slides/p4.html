<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P4 · 解决方案（三步）</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .wrap { position:relative; height:100%; display:flex; flex-direction:column; padding:100px 140px 72px; }
  .flow { display:flex; align-items:stretch; justify-content:center; margin-top:66px; flex:none; }
  .card4 { width:500px; background:#FFFFFF; border-radius:24px; box-shadow:0 18px 50px rgba(31,58,92,.09); padding:44px 46px 40px; }
  .card-top { display:flex; align-items:flex-start; justify-content:space-between; }
  .icon { width:76px; height:76px; border-radius:20px; display:flex; align-items:center; justify-content:center; }
  .ic-blue { background:#E9EEF5; } .ic-warm { background:#F4E7D8; }
  .num { font-family:'Noto Serif CJK SC', serif; font-weight:700; font-size:30px; color:#C25E0A; font-variant-numeric:tabular-nums; }
  .card4 h3 { font-size:30px; font-weight:700; color:#1F3A5C; margin-top:30px; letter-spacing:.02em; }
  .rule { height:1px; background:#ECE6D9; margin:22px 0; }
  .card4 p { font-size:19px; line-height:1.85; color:#44576E; }
  .card4 p b { color:#C25E0A; font-weight:700; }
  .joint { width:70px; display:flex; align-items:center; justify-content:center; flex:none; }
  .motifline { margin-top:auto; display:flex; align-items:center; justify-content:center; gap:20px; }
  .motifline .cap { font-size:14px; letter-spacing:.1em; color:#6E6557; flex:none; }
  .mdots { position:relative; width:170px; height:34px; flex:none; }
  .mdots i { position:absolute; border-radius:50%; }
  .mbars { display:flex; flex-direction:column; gap:6px; align-items:flex-start; flex:none; }
  .mbars span { height:14px; border-radius:6px; background:#E9EEF5; border:1px solid #D8E1EC; display:block; }
</style>
</head>
<body>
<section id="p4" class="wrap">
  <div class="overline">解决方案 · 三步</div>
  <h2 class="page-title">从桌面操作，到 Agent 可调用的<span class="acc">「个人上下文」</span></h2>

  <div class="flow">
    <div class="card4">
      <div class="card-top">
        <div class="icon ic-blue">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none"><rect x="4" y="7" width="32" height="22" rx="3" stroke="#1F3A5C" stroke-width="2.5"/><circle cx="13" cy="16" r="2.4" fill="#C25E0A"/><circle cx="21" cy="20" r="2.4" fill="#1F3A5C"/><circle cx="27" cy="14" r="2.4" fill="#C25E0A" opacity=".55"/><path d="M15 34 h10" stroke="#1F3A5C" stroke-width="2.5" stroke-linecap="round"/></svg>
        </div>
        <div class="num">01</div>
      </div>
      <h3>桌面记录</h3>
      <div class="rule"></div>
      <p>在 VDI 桌面中启用桌面记忆，即可采集用户在桌面中的操作信息，并记录下来。</p>
    </div>
    <div class="joint"><svg width="40" height="24" viewBox="0 0 40 24" fill="none"><path d="M0 12 H32 M25 4 L34 12 L25 20" stroke="#C25E0A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="card4">
      <div class="card-top">
        <div class="icon ic-warm">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="12" stroke="#1F3A5C" stroke-width="2.5"/><circle cx="20" cy="8" r="3.2" fill="#C25E0A"/><circle cx="31" cy="26" r="3.2" fill="#1F3A5C"/><circle cx="20" cy="20" r="3" fill="#C25E0A" opacity=".5"/></svg>
        </div>
        <div class="num">02</div>
      </div>
      <h3>形成记忆</h3>
      <div class="rule"></div>
      <p>这些数据一方面可以被用户的 Agent 调用，让 Agent 具备了桌面中的<b>「记忆」</b>。</p>
    </div>
    <div class="joint"><svg width="40" height="24" viewBox="0 0 40 24" fill="none"><path d="M0 12 H32 M25 4 L34 12 L25 20" stroke="#C25E0A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="card4">
      <div class="card-top">
        <div class="icon ic-blue">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none"><rect x="9" y="4" width="22" height="32" rx="3" stroke="#1F3A5C" stroke-width="2.5"/><path d="M14 12 h12 M14 18 h12 M14 24 h8" stroke="#C25E0A" stroke-width="2.2" stroke-linecap="round"/></svg>
        </div>
        <div class="num">03</div>
      </div>
      <h3>形成个人上下文</h3>
      <div class="rule"></div>
      <p>另一方面可以借助模型的能力将其整理为用户上下文，提升 Agent 成功率（如：当前用户的岗位、工作边界、写作偏好等）。</p>
    </div>
  </div>

  <div class="motifline">
    <span class="cap">桌面操作痕迹</span>
    <div class="mdots">
      <i style="left:2px;  top:18px; width:8px; height:8px; background:#C25E0A; opacity:.75;"></i>
      <i style="left:22px; top:6px;  width:7px; height:7px; background:#1F3A5C; opacity:.45;"></i>
      <i style="left:40px; top:24px; width:9px; height:9px; background:#E4DED0;"></i>
      <i style="left:62px; top:12px; width:7px; height:7px; background:#1F3A5C; opacity:.35;"></i>
      <i style="left:82px; top:20px; width:8px; height:8px; background:#C25E0A; opacity:.5;"></i>
      <i style="left:104px;top:8px;  width:7px; height:7px; background:#1F3A5C; opacity:.4;"></i>
      <i style="left:126px;top:22px; width:8px; height:8px; background:#1F3A5C; opacity:.3;"></i>
      <i style="left:148px;top:14px; width:7px; height:7px; background:#C25E0A; opacity:.45;"></i>
    </div>
    <svg width="36" height="18" viewBox="0 0 36 18" fill="none"><path d="M0 9 H28 M22 3 L30 9 L22 15" stroke="#C25E0A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="cap">结构化「个人上下文」</span>
    <div class="mbars"><span style="width:120px;"></span><span style="width:92px;"></span><span style="width:138px;"></span></div>
  </div>
</section>
</body>
</html>
